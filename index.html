<script type="module">
/* ═══ MOW CREW · a Multiplayer Agent starter ════════════════════════════════════════════
 * Mow the lawns on Maple Street in neat stripes. Drop-in, 1–8 players; bot crews mow too.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ day length, mower speed, deck, bag, prices, regrowth, hazards, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   STREET ........ the 8 yards (flower beds, gnomes, sprinklers, dogs), dumps, solid things
 *   GRASS GRID .... each yard as cells: cut or not and in which stripe, packing, stats
 *   SCENE ......... the diorama: board, road, houses, hedges, trees, the truck, compost bins
 *   LAWNS ......... drawing the yards: stripe textures, waving grass tufts, beds, signs
 *   MODELS ........ mowers, dogs, the arrow, particles and pop-up text
 *   DAY (HOST) .... the work day, every yard's grid, payouts, regrowth, cuts from paths
 *   BOTS (HOST) ... bot crews (pick a yard, mow rows, fix patches, empty the bag), dogs
 *   MY MOWER ...... driving, cutting on my screen at once, the bag, hazards, publishing
 *   OTHERS ........ other mowers, eased between snapshots, their cuts drawn right away
 *   HUD & RESULTS . cash, clock, bag, ranks, status, results, leaderboard, upgrades, saves
 *   INPUT ......... keyboard, hold the mouse, drag anywhere on touch
 *   MAIN LOOP ..... frame(), the camera, start()
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `k` (one JSON field: position, heading, speed,
 *     mowing on/off, deck size, bag fill) about 12 times a second, `n`/`c` (name, color)
 *     once and `hb` (heartbeat) once a second.
 *   - You mow on your own screen at once: the cells under your deck turn to stripes right
 *     away (a "pending" copy), so the satisfying part never waits for the network.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It owns the grass: it redraws every mower's path from the `k`
 *     snapshots (a line from each one to the next, so fast mowers leave no gaps) onto its
 *     grids, and writes one shared field per yard, `y0`…`y7`: version `v`, day, state,
 *     price, who cut how much, beds hit, and the cells packed 2 bits each in base64.
 *   - The host also writes `day` (id, v, phase, end time, everyone's cash, the results:
 *     ONE JSON field, `v` only goes up) and `bots` (bot crews and the dogs, ~10/s).
 *     A new host adopts all of them from state and carries on.
 *   - Everyone draws a yard from the host's field with their own pending cells on top until
 *     the host's copy has them, so a cut never flickers back to long grass.
 *   - The host pays a yard once 95% is cut (plus a few seconds to finish), split by how many
 *     cells each mower cut, and spots flower beds in the paths it redraws. Effects are
 *     events: "paid", "petals", "bit" (the dog got you: you stall), "woof", "bonk" (a
 *     gnome) and "dump".
 *   - Timers are timestamps: the day's end, each yard's finishing window and regrowth.
 *   - Leaderboard "best-day": each player's best day's cash. Savings and upgrades are a
 *     player save (namespace CONFIG.saveNs); offline, this browser.
 *   - Live ops: `payBonus` multiplies every price; running events show top right.
 *   - ?attract plays offline with bot crews only (the preview video is recorded from it).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  dayMs: 180000,           // one work day
  resultsMs: 14000,        // the results card, then the next day starts
  seats: 4,                // bot crews fill the street up to this many mowers
  speed: 5.4,              // your mower's top speed (units/s) before upgrades
  accel: 10,               // how fast mowers pick up speed
  turn: 4.2,               // how fast mowers turn (radians/s)
  deck: 0.75,              // cutting radius before upgrades (the stripe is twice as wide)
  bag: 450,                // grass cells the bag holds before upgrades
  upgrades: { deck: 0.15, speed: 0.8, bag: 0.45 }, // per level: more cutting radius, more top speed, more bag (share of its size)
  upgradeCost: [80, 160, 280], // what levels 1, 2 and 3 cost
  doneAt: 0.95,            // share of a yard's grass to cut before it pays...
  tidyMs: 5000,            // ...after a few more seconds to finish the patches (all of it = PERFECT)
  neatPerfect: 0.8,        // stripes this neat also earn PERFECT
  perfectBonus: 0.5,       // PERFECT adds this share of the price
  pricePerCell: 0.045,     // $ per cell of long grass when a yard comes up
  payBonus: 1,             // live ops: multiplies every price
  flowerFine: 5,           // $ off for mowing a flower bed
  restMs: 25000,           // a finished yard stays neat this long,
  regrowPerSec: 30,        // then this many cells grow back each second,
  reopenAt: 0.55,          // until this share is long again: it's a job again
  wetSlow: 0.55,           // speed in a sprinkler's spray (wet grass fills the bag twice as fast)
  sprinklerMs: [16000, 6000], // a sprinkler's cycle, and how much of it it sprays
  dogYards: [2, 5],        // yards with a sleeping dog
  dogWake: 3.4,            // driving this close wakes the dog
  dogSpeed: 4.3,           // how fast it runs after you
  dogChaseMs: 6500,        // how long it chases
  dogNapMs: 12000,         // how long it naps before it can wake again
  dogStunMs: 1800,         // caught: your mower stalls this long...
  dogFine: 5,              // ...and you pay this
  gnomeStunMs: 600,        // bumping a garden gnome stalls you this long
  botSpeed: 4.8,           // bot crews' top speed
  board: "best-day",       // leaderboard: each player's best day's cash
  saveNs: "mow-crew",      // player-save namespace for savings and upgrades
};
const BOT_NAMES = ["Fern", "Basil", "Clover", "Moss", "Rowan", "Hazel", "Sage", "Willow", "Juniper", "Olive"];
const COLORS = ["#ff5a5f", "#3fa7ff", "#ffb627", "#b57bff", "#ff8a3d", "#2ec4b6", "#ff6fb5", "#3b5bdb", "#f1f1f1", "#a0785a"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'mow-crew',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");
if (ATTRACT) Object.assign(CONFIG, { seats: 6, dayMs: 75000, resultsMs: 1500, doneAt: 0.9, tidyMs: 900, restMs: 9000, regrowPerSec: 70 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} }, reconnecting = false;
const memo = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fallback); memo.set(key, { raw, v }); return v; }
const shared = (key, fallback) => parseOnce("shared:" + key, S.shared[key], fallback);
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus me), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
/** A live-ops tunable: the owner's live config if it has one of the right type, else CONFIG. */
function liveCfg(k) { const v = net && net.live && net.live.config ? net.live.config[k] : undefined; return typeof v === typeof CONFIG[k] ? v : CONFIG[k]; }
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a), pick = (list) => list[Math.floor(Math.random() * list.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

// ── STREET ──────────────────────────────────────────────────────────────────────────
// Maple Street runs along x. Four lots on each side: a yard (the job), a driveway, a house
// behind and a hedge to the next lot. In a yard, `u` runs along the street (0..YW) and `w`
// from the sidewalk (0) back to the house (YD).
const CELL = 0.4, COLS = 40, ROWS = 27, CELLS = COLS * ROWS, YW = COLS * CELL, YD = ROWS * CELL; // a yard is 16 × 10.8
const ROAD = 3.6, WALK = 5.2, FRONT = 5.6, BACK = FRONT + YD; // |z| of the road's edge, the sidewalk's edge, a yard's front and back
const LANE = 2.6, EDGE_X = 44.3;                         // the lane bots drive along; how far along x anyone can drive
const LOT_X = [-31.5, -10.5, 10.5, 31.5];                // yard centers along the street (both sides)
const HEDGE_X = [-40.2, -19.4, 1.6, 22.6, 43.6];         // the hedges between lots
const GRASS = 0, BED = 1, BLOCKED = 2;                   // what a cell is
const BED_REACH = 0.6;                                   // share of the deck that must reach a bed to chop its flowers
const wx = (yd, u) => yd.x0 + u, wz = (yd, w) => yd.side * (FRONT + w); // yard → world
const lu = (yd, x) => x - yd.x0, lw = (yd, z) => yd.side * z - FRONT;   // world → yard
const SOLIDS = [];  // mowers can't drive through these: { x, z, r } circles and { x0, x1, z0, z1 } boxes
const DUMPS = [{ x: 0, z: 0, r: 3.6, truck: true }, { x: -19.4, z: 4.5, r: 2.5 }, { x: 22.6, z: -4.5, r: 2.5 }, { x: -40.2, z: -4.5, r: 2.5 }, { x: 43.6, z: 4.5, r: 2.5 }];
const inBed = (bd, u, w) => (bd.kind === "strip" ? u >= bd.u0 && u <= bd.u1 && w >= bd.w0 : Math.hypot(u - bd.u, w - bd.w) < bd.r);
const Y = [];       // the yards' layout, the same on every screen (what's cut lives in lawn[i])
for (let i = 0; i < 8; i++) {
  const side = i < 4 ? 1 : -1, cx = LOT_X[i % 4], rng = mulberry32(911 + i * 77), dogHere = CONFIG.dogYards.includes(i);
  const yd = { i, side, cx, x0: cx - YW / 2, num: side > 0 ? 2 + (i % 4) * 2 : 1 + (i % 4) * 2, beds: [], solidsL: [], spr: null, dog: null,
    kind: new Uint8Array(CELLS), bedOf: new Uint8Array(CELLS), grass: [], grassN: 0, order: [], rows: [], safe: new Uint8Array(CELLS), noise: new Float32Array(CELLS) };
  // A flower bed along the house (left half, right half or all of it), maybe a round one in a front corner.
  const k = dogHere ? 0 : Math.floor(rng() * 3), strip = { kind: "strip", u0: [0.6, 8.2, 0.6][k], u1: [7.8, 15.4, 15.4][k], w0: YD - 1.6 };
  yd.beds.push(strip);
  const round = rng() < 0.6 ? { kind: "round", u: rng() < 0.5 ? 0 : YW, w: 0, r: 2.3 } : null;
  if (round) yd.beds.push(round);
  // Garden gnomes: one beside the house bed, maybe one by the round bed.
  yd.solidsL.push({ u: k === 0 ? strip.u1 + 0.6 : k === 1 ? strip.u0 - 0.6 : 0.55, w: k === 2 ? YD - 2.1 : YD - 0.9, r: 0.3, gnome: true });
  if (round && rng() < 0.5) yd.solidsL.push({ u: round.u + (round.u ? -2 : 2), w: 2, r: 0.3, gnome: true });
  if (i % 3 === 1) yd.spr = { u: YW / 2 + (rng() - 0.5) * 4, w: 4.2 + rng() * 1.5, phase: rng() * CONFIG.sprinklerMs[0] };
  if (dogHere) { yd.solidsL.push({ u: YW - 1.1, w: YD - 1.0, r: 0.9, house: true }); yd.dog = { x: wx(yd, YW - 2.7), z: wz(yd, YD - 2.4), h: side > 0 ? Math.PI : 0 }; }
  for (let c = 0; c < CELLS; c++) {
    const u = ((c % COLS) + 0.5) * CELL, w = (Math.floor(c / COLS) + 0.5) * CELL;
    yd.beds.forEach((bd, b) => { if (inBed(bd, u, w)) { yd.kind[c] = BED; yd.bedOf[c] = b + 1; } });
    for (const s of yd.solidsL) if (Math.hypot(u - s.u, w - s.w) < s.r + 0.15) yd.kind[c] = BLOCKED;
    if (yd.kind[c] === GRASS) yd.grass.push(c);
    yd.noise[c] = 0.93 + rng() * 0.14;
  }
  yd.grassN = yd.grass.length;
  yd.solidsL.forEach((s, n) => SOLIDS.push({ x: wx(yd, s.u), z: wz(yd, s.w), r: s.r, gnome: s.gnome ? { y: i, n } : null }));
  // Regrowth comes back in clumps: cells ordered by a smooth noise, the highest first.
  const ph = [rng() * 6.3, rng() * 6.3, rng() * 6.3], score = (c) => { const u = (c % COLS) * CELL, w = Math.floor(c / COLS) * CELL; return Math.sin(u * 0.5 + ph[0]) + Math.sin(w * 0.65 + ph[1]) + Math.sin((u - w) * 0.33 + ph[2]) + rng() * 0.9; };
  yd.order = yd.grass.map((c) => [c, score(c)]).sort((a, b) => b[1] - a[1]).map((e) => e[0]);
  yd.fancy = 1 + 0.08 * (yd.beds.length + yd.solidsL.length + (yd.spr ? 1 : 0) + (dogHere ? 1 : 0)); // fussier yards pay more
  Y.push(yd);
}
/** The stretch [a, b] of a row (at depth w) a deck of radius dr can mow without touching a bed, a gnome or the doghouse. */
function rowSpan(yd, w, dr) {
  let a = dr * 0.75, b = YW - dr * 0.75;
  const reach = dr * BED_REACH + 0.15;
  const cut = (lo, hi) => { if (hi <= a || lo >= b) return; if (lo - a >= b - hi) b = Math.min(b, lo); else a = Math.max(a, hi); }; // keep the longer side
  const circle = (cu, cw, R) => { const dw = Math.abs(w - cw); if (dw < R) { const h = Math.sqrt(R * R - dw * dw); cut(cu - h, cu + h); } };
  for (const bd of yd.beds) { if (bd.kind === "strip") { if (w + reach > bd.w0) cut(bd.u0 - reach, bd.u1 + reach); } else circle(bd.u, bd.w, bd.r + reach); }
  for (const s of yd.solidsL) circle(s.u, s.w, s.r + dr + 0.9);
  return b - a > 1.2 ? { w, a, b } : null;
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  if (ATTRACT) $("net").textContent = "";
  try { applySave(JSON.parse(stored("mow-crew.save") || "null")); } catch {}
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("paid", (m) => { if (m && typeof m.y === "number") paidFx(m); });
  net.on("petals", (m) => { if (m && typeof m.y === "number" && !(m.by === net.sessionId && (me.hitBeds.get(m.y) || 0) & (1 << m.b))) petalFx(m); });
  net.on("bit", (m) => { if (m && typeof m.x === "number") bitFx(m); });
  net.on("woof", (m) => { if (m && typeof m.x === "number") woofFx(m); });
  net.on("bonk", (m) => { if (m && typeof m.y === "number") bonkFx(m, false); });
  net.on("dump", (m) => { if (m && typeof m.x === "number") dumpFx(m); });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  net.onLive((live) => { $("event").textContent = ((live && live.active) || []).map((e) => e.title).join(" · "); });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); loadAccountSave(); }
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b && b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  me.id = net.sessionId; spawnMe();
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  renderUps();
  if (TEST) window.__test = { me, keys, S: () => S, day, lawn, Y, isHost, botList, dogList, crews, host, yardStats, views, camera, groundAt, tally, mouse, stick, save: () => save };
  requestAnimationFrame(frame);
})();
